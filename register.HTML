<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>ثبت نام | Royal Gold</title>

<style>



*{
    margin:0;
    padding:0;
    box-sizing:border-box;
 
}

body{
background:#dff4f1;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px 0;
}

.register-box{

width:450px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

}

.logo{

text-align:center;

font-size:42px;

font-weight:bold;

color:#1b7f79;

margin-bottom:30px;

}

.logo span{
color:#1b7f79;
}

h2{

text-align:center;

margin-bottom:25px;

color:#1b7f79;

}

.input-group{
margin-bottom:18px;
}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.input-group input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}

.input-group input:focus{

outline:none;

border-color:#1b7f79;

}

.btn{

width:100%;

padding:15px;

background:#1b7f79;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.btn:hover{

background:#0f6d67;

}

.login-link{

text-align:center;

margin-top:20px;

}

.login-link a{

text-decoration:none;

color:#d4af37;

font-weight:bold;

}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">
ROYAL <span>GOLD</span>
</div>

<h2>ایجاد حساب کاربری</h2>

<form>

<div class="input-group">
<label>نام و نام خانوادگی</label>
<input type="text">
</div>

<div class="input-group">
<label>شماره موبایل</label>
<input type="text">
</div>

<div class="input-group">
<label>ایمیل</label>
<input type="email">
</div>

<div class="input-group">
<label>رمز عبور</label>
<input type="password">
</div>

<div class="input-group">
<label>تکرار رمز عبور</label>
<input type="password">
</div>

<button class="btn">
ثبت نام
</button>

</form>

<div class="login-link">

<a href="login.html">
قبلاً ثبت نام کرده‌ام
</a>

</div>

</div>

</body>
</html>
