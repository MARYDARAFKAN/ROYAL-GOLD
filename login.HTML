<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<title>ورود | Royal Gold</title>

<style>

@font-face{
 
   font-family:'Vazirmatn';
    src:url('font/Vazirmatn-Regular.ttf');

}

*{
margin:0;
padding:0;
box-sizing:border-box;

}

body{
background:#dff4f1;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{

width:420px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

}

.logo{

text-align:center;

font-size:42px;

font-weight:bold;

margin-bottom:25px;

color:#1b7f79;

}

.logo span{
color:#145f5a;
}

h2{

text-align:center;

margin-bottom:25px;

color:#1b7f79;

}

.input-group{
margin-bottom:20px;
}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.input-group input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}

.input-group input:focus{

outline:none;

border-color:#1b7f79;

}

.btn{

width:100%;

padding:15px;

background:#1b7f79;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.btn:hover{

background:#0f6d67;

}

.links{

display:flex;

justify-content:space-between;

margin-top:20px;

font-size:14px;

}

.links a{

text-decoration:none;

color:#d4af37;

font-weight:bold;

}


</style>



</head>

<body>

<div class="login-box">

<div class="logo">
ROYAL <span>GOLD</span>
</div>


<h2>ورود به حساب کاربری</h2>

<form>

<div class="input-group">
<label>شماره موبایل یا ایمیل</label>
<input type="text">
</div>

<div class="input-group">
<label>رمز عبور</label>
<input type="password">
</div>

<button class="btn">
ورود
</button>

</form>

<div class="links">

<a href="register.html">
ثبت نام
</a>

<a href="#">
فراموشی رمز عبور
</a>

</div>

</div>

</body>

</html>
