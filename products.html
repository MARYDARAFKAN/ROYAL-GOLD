<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>محصولات | Royal Gold</title>

<style>


*{
margin:0;
padding:0;
box-sizing:border-box;

}

body{
background:#dff4f1;
}

/* هدر */

.header{
background:#1b7f79;
padding:20px;
text-align:center;
}

.logo{
font-size:40px;
font-weight:bold;
color:white;
}

.logo span{
color:#d4af37;
}

/* منو */

.menu{
background:white;
padding:15px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.menu a{
text-decoration:none;
margin:0 20px;
color:#1b7f79;
font-weight:bold;
}

/* عنوان */

.title{
text-align:center;
margin:50px 0;
font-size:42px;
color:#1b7f79;
}

/* محصولات */

.products{

width:90%;
margin:auto;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:30px;

padding-bottom:60px;

}

.card{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform:translateY(-6px);

}

.card img{

width:100%;

height:280px;

object-fit:cover;

}

.info{

padding:20px;

}

.name{

font-size:22px;

font-weight:bold;

margin-bottom:10px;

}

.weight{

color:#1b7f79;

margin-bottom:10px;

}

.price{

font-size:24px;

color:#d4af37;

font-weight:bold;

margin-bottom:20px;

}

.buttons{

display:flex;

gap:10px;

}

.btn{

flex:1;

padding:12px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.view{

background:#1b7f79;

color:white;

}

.cart{

background:#d4af37;

color:white;

}

</style>

</head>

<body>

<div class="header">

<div class="logo">
ROYAL <span>GOLD</span>
</div>

</div>

<div class="menu">

<a href="index.html">خانه</a>
<a href="products.html">محصولات</a>
<a href="login.html">ورود</a>
<a href="register.html">ثبت نام</a>

</div>

</div>

</button>

</div>

</div>

</div>

</div>

</body>

</html>
